# PrusaSlicer 2.7 CLI profile used for the V0.1 estimate (generic 0.4 mm nozzle, PLA)
# Orientation: as modelled (five skate pads + bottom grid on the bed, Z up). No rotation needed.
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 25
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = gyroid
extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
elefant_foot_compensation = 0.15
# supports: only from the bed (through the open bottom), tree/organic so they peel out of the windows
support_material = 1
support_material_auto = 1
support_material_threshold = 45
support_material_buildplate_only = 1
support_material_style = organic
support_material_contact_distance = 0.2
support_material_interface_layers = 2
dont_support_bridges = 0
bed_shape = 0x0,250x0,250x210,0x210
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
